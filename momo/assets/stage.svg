  <path fill="url(#leftShade)" d="M0 0H1500V620H0z"/>
  <path fill="url(#vignette)" d="M0 0H1500V620H0z"/>
  <path fill="#B5A184" opacity=".12" filter="url(#grain)" d="M0 0H1500V620H0z"/>
</svg>
