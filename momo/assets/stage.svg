    <use href="#person" transform="translate(1012 529) scale(1.53)"/>
    <use href="#person" transform="translate(1087 540) scale(1.7)"/>
    <use href="#person" transform="translate(1163 526) scale(1.54)"/>
    <use href="#person" transform="translate(1234 545) scale(1.72)"/>
    <use href="#person" transform="translate(1313 532) scale(1.61)"/>
    <use href="#person" transform="translate(1385 546) scale(1.74)"/>
    <use href="#person" transform="translate(1460 532) scale(1.58)"/>
  </g>
  <g fill="#F8CA93" opacity=".55" filter="url(#smallDefocus)">
    <circle cx="674" cy="500" r="2"/><circle cx="759" cy="480" r="1.6"/>
    <circle cx="880" cy="507" r="1.9"/><circle cx="1027" cy="479" r="1.5"/>
    <circle cx="1139" cy="495" r="1.8"/><circle cx="1277" cy="512" r="2"/>
    <circle cx="1405" cy="505" r="1.5"/>
    <path d="M846 472h5v9h-5zm357-8h5v10h-5zm102 22h5v8h-5z"/>
