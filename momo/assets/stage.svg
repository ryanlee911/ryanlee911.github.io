    <use href="#person" transform="translate(897 476) scale(.76)"/>
    <use href="#person" transform="translate(930 468) scale(.8)"/>
    <use href="#person" transform="translate(970 478) scale(.88)"/>
    <use href="#person" transform="translate(1005 474) scale(.72)"/>
    <use href="#person" transform="translate(1045 472) scale(.81)"/>
    <use href="#person" transform="translate(1084 478) scale(.79)"/>
    <use href="#person" transform="translate(1120 470) scale(.82)"/>
    <use href="#person" transform="translate(1155 476) scale(.77)"/>
    <use href="#person" transform="translate(1196 471) scale(.83)"/>
    <use href="#person" transform="translate(1236 480) scale(.75)"/>
    <use href="#person" transform="translate(1275 475) scale(.88)"/>
    <use href="#person" transform="translate(1314 478) scale(.79)"/>
    <use href="#person" transform="translate(1356 485) scale(.86)"/>
    <use href="#person" transform="translate(1400 489) scale(.9)"/>
    <use href="#person" transform="translate(1445 486) scale(.84)"/>
    <use href="#person" transform="translate(1480 498) scale(.9)"/>
  </g>
  <path d="M533 620v-64c0-17 16-30 33-27l9 2 5-19 6-2 2 6-3 34 18 70Zm288 0 12-85 9-8 14-49 7 2-8 53 6 11 12 76Zm366 0 16-83 17-29 13-39 6 1-8 45-9 28 5 77Zm141 0 6-69-14-38-20-30 5-4 26 29 19 34 13 78Z" fill="#0F1A14" filter="url(#defocus)"/>
  <g fill="#101B14" filter="url(#defocus)">
    <use href="#person" transform="translate(503 550) scale(1.6)"/>
    <use href="#person" transform="translate(581 534) scale(1.42)"/>
    <use href="#person" transform="translate(651 542) scale(1.6)"/>
    <use href="#person" transform="translate(723 526) scale(1.47)"/>
    <use href="#person" transform="translate(792 546) scale(1.66)"/>
    <use href="#person" transform="translate(860 531) scale(1.56)"/>
